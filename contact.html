
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Me</title>

</head>

<body>

    <header>

        <h1>Contact Me</h1>

        <a href="index.html">
            Home
        </a>

        &nbsp; | &nbsp;

        <a href="about.html">
            About
        </a>

    </header>

    <hr>

    <main>

        <h2>Contact Form</h2>

        <form action="#">

            <label for="name">
                Full Name:
            </label>

            <br>

            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your name">

            <br><br>


            <label for="email">
                Email:
            </label>

            <br>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email">

            <br><br>


            <label for="phone">
                Phone:
            </label>

            <br>

            <input type="tel"
                   id="phone"
                   name="phone">

            <br><br>


            <label for="message">
                Message:
            </label>

            <br>

            <textarea id="message"
                      name="message"
                      rows="6"
                      cols="40">
            </textarea>

            <br><br>


            <input type="submit"
                   value="Send Message">

        </form>

    </main>

    <hr>

    <footer>

        <p>
            Email: student@example.com
        </p>

    </footer>

</body>

</html>
